name: Docs

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch or ref to build"
        required: false
        default: "dev"
      deploy:
        description: "Deploy the build"
        required: false
        type: boolean
        default: false
  release:
    types: [published]

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCS_REF: ${{ github.event.inputs.branch || github.ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.DOCS_REF }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Install docs dependencies
        run: uv sync --extra docs --frozen

      - name: Build docs
        run: uv run zensical build --clean

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    if: >
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')
    needs: build
    runs-on: ubuntu-latest
    environment:
      # use a dedicated Pages environment so release tags, including betas,
      # are not blocked by the protected github-pages environment rules.
      name: docs-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
