[project]
name = "reclaimerr"
version = "0.5.3"
description = "Backend of Reclaimerr"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "apprise>=1.13.1",
    "apscheduler>=3.11.3,<4.0.0",
    "argon2-cffi>=25.1.0",
    "authlib>=1.8.0",
    "cryptography>=50.0.1",
    "fastapi[standard]>=0.141.1",
    "granian>=2.8.3",
    "itsdangerous>=2.2.0",
    "niquests[speedups]>=3.21.2",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "python-iso639>=2026.7.23",
    "python-dotenv>=1.2.3",
    "semver>=3.1.0",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.0.54,<2.1",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.0",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "uvicorn>=0.53.0",
    "poethepoet>=0.48.0",
]

[project.optional-dependencies]
desktop = [
    "pyinstaller>=6.22.3",
    "pystray>=0.19.5",
    "platformdirs>=4.11.12",
    "filelock>=4.0.1",
    "uvicorn>=0.53.0",
]
docs = ["zensical>=0.0.63", "pymdown-extensions>=12.0.1"]

[project.urls]
Homepage = "https://github.com/jessielw/Reclaimerr"
Source = "https://github.com/jessielw/Reclaimerr"
Documentation = "https://jessielw.github.io/Reclaimerr"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/core", "backend/api", "backend/services"]

[tool.ruff]
line-length = 88
target-version = "py311"
include = [
    "backend/core/**/*.py",
    "backend/api/**/*.py",
    "backend/services/**/*.py",
    "backend/tasks/**/*.py",
    "desktop/**/*.py",
    "scripts/**/*.py",
]
exclude = ["backend/alembic/**/versions/*.py"]

[tool.ruff.lint]
select = ["I", "UP"]

[tool.basedpyright]
include = ["backend", "desktop"]
exclude = ["backend/alembic/versions"]
typeCheckingMode = "standard"
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.poe.tasks]
typecheck = "basedpyright"
lint = "ruff check ."
lint-fix = "ruff check . --fix"
format-check = "ruff format . --check"
format-code = "ruff format ."
format.sequence = ["lint-fix", "format-code"]
sync-dev = "scripts/sync_dev.py"
